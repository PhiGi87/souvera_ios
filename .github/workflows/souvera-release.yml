name: Souvera Workspace - Build

on:
  push:
    branches:
      - 'souvera/**'
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    branches:
      - 'souvera/**'
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload the build to TestFlight'
        required: true
        default: false
        type: boolean

env:
  PROJECT: Souvera.xcodeproj
  SCHEME: Nextcloud
  XCODE_VERSION: '26.0.1'
  TEAM_ID: S76D7JCS9V
  DERIVED_DATA: DerivedDataArchive
  SIM_DERIVED_DATA: DerivedDataSim

jobs:
  build-check:
    name: Compile check (no signing)
    runs-on: macos-15
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v5

      - name: Download GoogleService-Info.plist
        run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E 'error:|BUILD FAILED' || true
          [ ${PIPESTATUS[0]} -eq 0 ] || { cat build.log | grep 'error:'; exit 1; }

  archive:
    name: Archive & IPA
    runs-on: macos-15
    needs: build-check
    timeout-minutes: 120
    if: |
      always() &&
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.build-check.result == 'success') &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/souvera/'))

    steps:
      - uses: actions/checkout@v5

      - name: Download GoogleService-Info.plist
        run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Required repo secrets (Settings -> Secrets and variables -> Actions):
      #   ASC_API_KEY_ID          - Key ID from App Store Connect > Users and Access > Keys
      #   ASC_API_ISSUER_ID       - Issuer ID shown on the same Keys page
      #   ASC_API_KEY_P8_BASE64   - base64 of AuthKey_XXXX.p8
      #   IOS_CERT_P12_BASE64     - base64 of the fixed distribution certificate (.p12, legacy export)
      #   IOS_CERT_PASSWORD       - password of that .p12
      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEYFILE=~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          printf '%s' "$ASC_API_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYFILE"
          if ! head -1 "$KEYFILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::ASC_API_KEY_P8_BASE64 did not decode to a valid .p8"
            exit 1
          fi
          echo "API key decoded OK (Key ID ${ASC_API_KEY_ID})."

      # Import the FIXED distribution certificate (.p12 from secrets) into a
      # dedicated CI keychain, so xcodebuild reuses it instead of creating a
      # new certificate on every run (Apple allows max. 3 per team).
      # The .p12 must be exported with OpenSSL legacy crypto
      # (openssl pkcs12 -export -legacy ...) - the macOS Security framework
      # rejects modern PBES2/AES + SHA-256 MAC containers.
      # To renew the certificate (expires Aug 2027): create a new one and
      # update the secrets IOS_CERT_P12_BASE64 and IOS_CERT_PASSWORD.
      - name: Import signing certificate
        id: cert_import
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -e
          if [ -z "$IOS_CERT_P12_BASE64" ]; then
            echo "::error::IOS_CERT_P12_BASE64 is not set"
            exit 1
          fi
          mkdir -p ~/certs
          printf '%s' "$IOS_CERT_P12_BASE64" | tr -d '[:space:]' > ~/certs/souvera.p12.b64
          echo "IOS_CERT_P12_BASE64 length: $(wc -c < ~/certs/souvera.p12.b64) (expected 4308)"
          echo "IOS_CERT_PASSWORD length: ${#IOS_CERT_PASSWORD} (expected 24)"
          base64 --decode < ~/certs/souvera.p12.b64 > ~/certs/souvera.p12
          if ! openssl pkcs12 -in ~/certs/souvera.p12 -noout -passin "pass:${IOS_CERT_PASSWORD}" 2>/dev/null; then
            echo "::error::The .p12 does not match IOS_CERT_PASSWORD (wrong password or truncated base64)"
            exit 1
          fi
          if openssl pkcs12 -in ~/certs/souvera.p12 -noout -info -passin "pass:${IOS_CERT_PASSWORD}" 2>&1 | grep -qE "MAC: sha256"; then
            echo "::error::The .p12 is not Apple-compatible (MAC is sha256). Re-export with: openssl pkcs12 -export -legacy ..."
            exit 1
          fi
          # Import into a dedicated CI keychain with a KNOWN password and put it
          # first in the search list, so codesign can access the private key
          # without any interactive prompt (a prompt hangs CI forever).
          security delete-keychain ci.keychain 2>/dev/null || true
          security create-keychain -p ci ci.keychain
          security set-keychain-settings -lut 21600 ci.keychain
          security unlock-keychain -p ci ci.keychain
          security list-keychains -d user -s ci.keychain "$HOME/Library/Keychains/login.keychain-db"
          security import ~/certs/souvera.p12 -k ci.keychain -P "$IOS_CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/xcodebuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci ci.keychain
          if ! security find-identity -v -p codesigning ci.keychain | grep -q "Apple Distribution"; then
            echo "::error::Import succeeded but no 'Apple Distribution' identity found in keychain"
            exit 1
          fi
          rm -f ~/certs/souvera.p12

      # Apple requires a strictly increasing bundle version per TestFlight
      # upload: only run when a TestFlight upload was requested.
      - name: Bump build number
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.upload_testflight == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bundle exec fastlane bump_build_number

      # Cache key must ignore the build number (it changes on upload runs) but
      # still track dependency/pbxproj changes.
      - name: Compute dependency fingerprint
        id: depfingerprint
        run: |
          KEY=$(grep -v CURRENT_PROJECT_VERSION Souvera.xcodeproj/project.pbxproj | shasum | cut -d' ' -f1)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: souvera-deriveddata-v3-${{ steps.depfingerprint.outputs.key }}-${{ runner.os }}-${{ env.XCODE_VERSION }}

      # Downloads the pre-created App Store provisioning profiles (which carry
      # the App Groups capabilities) and writes ExportOptions.plist for manual
      # signing. Must run BEFORE the archive, because the archive signs with
      # the per-target PROVISIONING_PROFILE_SPECIFIER UUIDs from the project.
      - name: Install distribution provisioning profiles
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          EXPORT_METHOD: app-store-connect
        run: bundle exec ruby .github/scripts/install_profiles.rb

      - name: Archive (manual signing)
        id: archive
        timeout-minutes: 50
        run: |
          echo "Xcode version: $(xcodebuild -version | head -1)"
          set -o pipefail
          set +e
          perl -e 'alarm shift; exec @ARGV' 2700 \
            xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath "build/Souvera.xcarchive" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee archive.log
          ARCHIVE_EXIT=${PIPESTATUS[0]}
          set -e
          echo "=== xcodebuild archive exit: $ARCHIVE_EXIT ==="
          if [ "$ARCHIVE_EXIT" -eq 142 ]; then
            echo "archive timed out - sampling hung processes"
            mkdir -p build/logs
            for pid in $(pgrep -x codesign); do
              sample "$pid" 5 -file "build/logs/codesign-$pid-sample.txt" 2>/dev/null || true
            done
            for pid in $(pgrep -x xcodebuild); do
              sample "$pid" 5 -file "build/logs/xcodebuild-$pid-sample.txt" 2>/dev/null || true
            done
          fi
          [ "$ARCHIVE_EXIT" = "0" ]

      - name: Collect archive log
        if: always()
        run: |
          mkdir -p build/logs
          [ -f archive.log ] && cp archive.log build/logs/ || true

      - name: Save DerivedData cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: souvera-deriveddata-v3-${{ steps.depfingerprint.outputs.key }}-${{ runner.os }}-${{ env.XCODE_VERSION }}

      - name: Export IPA
        if: steps.archive.outcome == 'success'
        timeout-minutes: 20
        run: |
          set -o pipefail
          set +e
          perl -e 'alarm shift; exec @ARGV' 1200 \
            xcodebuild -exportArchive \
            -archivePath "build/Souvera.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "build/export" \
            2>&1 | tee export.log
          EXPORT_EXIT=${PIPESTATUS[0]}
          set -e
          mkdir -p build/logs
          cp export.log build/logs/ 2>/dev/null || true
          cp -R /var/folders/*/*/T/Nextcloud_*.xcdistributionlogs build/logs/ 2>/dev/null || true
          if [ "$EXPORT_EXIT" -eq 142 ]; then
            echo "export timed out - sampling hung processes"
            for pid in $(pgrep -x codesign); do
              sample "$pid" 5 -file "build/logs/codesign-$pid-sample.txt" 2>/dev/null || true
            done
          fi
          ls -la build/export/ 2>/dev/null || true
          echo "=== exportArchive exit: $EXPORT_EXIT ==="
          [ "$EXPORT_EXIT" = "0" ]

      - name: Upload debug logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: build/logs/
          retention-days: 7

      - name: Upload IPA artifact
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Souvera Workspace IPA
          path: build/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight via fastlane pilot
        if: |
          steps.archive.outcome == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.event.inputs.upload_testflight == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bundle exec fastlane upload_beta

  simulator:
    name: Simulator App (.app)
    runs-on: macos-15
    needs: build-check
    timeout-minutes: 90
    if: |
      always() &&
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.build-check.result == 'success') &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/souvera/'))

    steps:
      - uses: actions/checkout@v5

      - name: Download GoogleService-Info.plist
        run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Compute dependency fingerprint
        id: depfingerprint
        run: |
          KEY=$(grep -v CURRENT_PROJECT_VERSION Souvera.xcodeproj/project.pbxproj | shasum | cut -d' ' -f1)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.SIM_DERIVED_DATA }}
          key: souvera-sim-v1-${{ steps.depfingerprint.outputs.key }}-${{ runner.os }}-${{ env.XCODE_VERSION }}

      - name: Build for simulator
        timeout-minutes: 50
        run: |
          set -o pipefail
          set +e
          perl -e 'alarm shift; exec @ARGV' 2700 \
            xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -derivedDataPath "$SIM_DERIVED_DATA" \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee sim-build.log
          SIM_EXIT=${PIPESTATUS[0]}
          set -e
          echo "=== simulator build exit: $SIM_EXIT ==="
          mkdir -p build/logs
          cp sim-build.log build/logs/ 2>/dev/null || true
          [ "$SIM_EXIT" = "0" ]

      - name: Save DerivedData cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.SIM_DERIVED_DATA }}
          key: souvera-sim-v1-${{ steps.depfingerprint.outputs.key }}-${{ runner.os }}-${{ env.XCODE_VERSION }}

      - name: Package simulator app
        if: success()
        run: |
          APP_PATH="$SIM_DERIVED_DATA/Build/Products/Debug-iphonesimulator/Souvera.app"
          [ -d "$APP_PATH" ] || { echo "::error::Simulator app not found at $APP_PATH"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "Souvera.app.zip"
          ls -la Souvera.app.zip

      - name: Upload simulator app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Souvera Simulator App
          path: Souvera.app.zip
          retention-days: 14
