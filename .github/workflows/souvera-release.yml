name: Souvera Workspace - TestFlight Upload

on:
  push:
    branches:
      - 'souvera/**'
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    branches:
      - 'souvera/**'
  workflow_dispatch:

env:
  PROJECT: Nextcloud.xcodeproj
  SCHEME: Nextcloud
  XCODE_VERSION: '26.0.1'
  TEAM_ID: S76D7JCS9V
  DERIVED_DATA: DerivedDataArchive

jobs:
  build-check:
    name: Compile check (no signing)
    runs-on: macos-15
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v5

      - name: Download GoogleService-Info.plist
        run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Build (no signing)
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E 'error:|BUILD FAILED' || true
          [ ${PIPESTATUS[0]} -eq 0 ] || { cat build.log | grep 'error:'; exit 1; }

  archive:
    name: Archive, Sign & Upload to TestFlight
    runs-on: macos-15
    needs: build-check
    timeout-minutes: 240
    if: |
      always() &&
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.build-check.result == 'success') &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/souvera/'))

    steps:
      - uses: actions/checkout@v5

      - name: Download GoogleService-Info.plist
        run: wget "https://raw.githubusercontent.com/firebase/quickstart-ios/master/mock-GoogleService-Info.plist" -O GoogleService-Info.plist

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Required repo secrets (Settings -> Secrets and variables -> Actions):
      #   ASC_API_KEY_ID          - Key ID from App Store Connect > Users and Access > Keys
      #   ASC_API_ISSUER_ID       - Issuer ID shown on the same Keys page
      #   ASC_API_KEY_P8_BASE64   - base64 of AuthKey_XXXX.p8
      #   IOS_CERT_P12_BASE64     - base64 of the fixed distribution certificate (.p12, legacy export)
      #   IOS_CERT_PASSWORD       - password of that .p12
      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          KEYFILE=~/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          printf '%s' "$ASC_API_KEY_P8_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYFILE"
          if ! head -1 "$KEYFILE" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::error::ASC_API_KEY_P8_BASE64 did not decode to a valid .p8"
            exit 1
          fi
          echo "API key decoded OK (Key ID ${ASC_API_KEY_ID})."

      # Import the FIXED distribution certificate (.p12 from secrets) into a
      # dedicated CI keychain, so xcodebuild reuses it instead of creating a
      # new certificate on every run (Apple allows max. 3 per team).
      # The .p12 must be exported with OpenSSL legacy crypto
      # (openssl pkcs12 -export -legacy ...) - the macOS Security framework
      # rejects modern PBES2/AES + SHA-256 MAC containers.
      # To renew the certificate (expires Aug 2027): create a new one and
      # update the secrets IOS_CERT_P12_BASE64 and IOS_CERT_PASSWORD.
      - name: Import signing certificate
        id: cert_import
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -e
          if [ -z "$IOS_CERT_P12_BASE64" ]; then
            echo "::error::IOS_CERT_P12_BASE64 is not set"
            exit 1
          fi
          mkdir -p ~/certs
          printf '%s' "$IOS_CERT_P12_BASE64" | tr -d '[:space:]' > ~/certs/souvera.p12.b64
          echo "IOS_CERT_P12_BASE64 length: $(wc -c < ~/certs/souvera.p12.b64) (expected 4308)"
          echo "IOS_CERT_PASSWORD length: ${#IOS_CERT_PASSWORD} (expected 24)"
          base64 --decode < ~/certs/souvera.p12.b64 > ~/certs/souvera.p12
          if ! openssl pkcs12 -in ~/certs/souvera.p12 -noout -passin "pass:${IOS_CERT_PASSWORD}" 2>/dev/null; then
            echo "::error::The .p12 does not match IOS_CERT_PASSWORD (wrong password or truncated base64)"
            exit 1
          fi
          if openssl pkcs12 -in ~/certs/souvera.p12 -noout -info -passin "pass:${IOS_CERT_PASSWORD}" 2>&1 | grep -qE "MAC: sha256"; then
            echo "::error::The .p12 is not Apple-compatible (MAC is sha256). Re-export with: openssl pkcs12 -export -legacy ..."
            exit 1
          fi
          security import ~/certs/souvera.p12 -k "$HOME/Library/Keychains/login.keychain-db" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
          if ! security find-identity -v -p codesigning "$HOME/Library/Keychains/login.keychain-db" | grep -q "Apple Distribution"; then
            echo "::error::Import succeeded but no 'Apple Distribution' identity found in keychain"
            exit 1
          fi
          rm -f ~/certs/souvera.p12

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: souvera-deriveddata-v2-${{ hashFiles('Nextcloud.xcodeproj/project.pbxproj') }}-${{ runner.os }}-${{ env.XCODE_VERSION }}

      # Downloads the pre-created App Store provisioning profiles (which carry
      # the App Groups capabilities) and writes ExportOptions.plist for manual
      # signing. Must run BEFORE the archive, because the archive signs with
      # the per-target PROVISIONING_PROFILE_SPECIFIER UUIDs from the project.
      - name: Install distribution provisioning profiles
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          EXPORT_METHOD: app-store-connect
        run: bundle exec ruby .github/scripts/install_profiles.rb

      - name: Archive (manual signing)
        id: archive
        run: |
          echo "Xcode version: $(xcodebuild -version | head -1)"
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -archivePath "build/Souvera.xcarchive" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -skipPackagePluginValidation \
            2>&1 | tee archive.log
          echo "=== xcodebuild archive exit: ${PIPESTATUS[0]} ==="

      - name: Collect archive log
        if: always()
        run: |
          mkdir -p build/logs
          [ -f archive.log ] && cp archive.log build/logs/ || true

      - name: Save DerivedData cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DERIVED_DATA }}
          key: souvera-deriveddata-v2-${{ hashFiles('Nextcloud.xcodeproj/project.pbxproj') }}-${{ runner.os }}-${{ env.XCODE_VERSION }}

      - name: Export IPA
        if: steps.archive.outcome == 'success'
        run: |
          xcodebuild -exportArchive \
            -archivePath "build/Souvera.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "build/export" \
            2>&1 | tee export.log
          EXPORT_EXIT=${PIPESTATUS[0]}
          mkdir -p build/logs
          cp export.log build/logs/ 2>/dev/null || true
          cp -R /var/folders/*/*/T/Nextcloud_*.xcdistributionlogs build/logs/ 2>/dev/null || true
          ls -la build/export/ 2>/dev/null || true
          echo "=== exportArchive exit: $EXPORT_EXIT ==="
          exit $EXPORT_EXIT

      - name: Upload debug logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs
          path: build/logs/
          retention-days: 7

      - name: Upload IPA artifact
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Souvera Workspace IPA
          path: build/export/*.ipa
          retention-days: 14

      - name: Upload to TestFlight via fastlane pilot
        if: steps.archive.outcome == 'success'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: bundle exec fastlane upload_beta
